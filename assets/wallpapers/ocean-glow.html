<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocean Glow Wallpaper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let time = 0;
    const waveOctaves = 3;
    const particles = [];
    const particleCount = 60;

    class WaveParticle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.baseY = this.y;
        this.size = Math.random() * 4 + 1;
        this.speedX = (Math.random() - 0.5) * 0.8;
        this.frequency = Math.random() * 0.05 + 0.01;
        this.phase = Math.random() * Math.PI * 2;
      }

      update(time) {
        this.x += this.speedX;
        this.y = this.baseY + Math.sin(time * this.frequency + this.phase) * 20;

        if (this.x > canvas.width + 20) {
          this.x = -20;
          this.y = Math.random() * canvas.height;
          this.baseY = this.y;
        }
        if (this.x < -20) {
          this.x = canvas.width + 20;
          this.y = Math.random() * canvas.height;
          this.baseY = this.y;
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = 0.6;
        
        const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
        gradient.addColorStop(0, '#00e5ff');
        gradient.addColorStop(1, 'rgba(0, 229, 255, 0)');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#00e5ff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
      }
    }

    function init() {
      for (let i = 0; i < particleCount; i++) {
        particles.push(new WaveParticle());
      }
    }

    function drawOceanWaves() {
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, '#0a2838');
      gradient.addColorStop(1, '#05141a');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw wave lines
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.1)';
      ctx.lineWidth = 1;

      for (let waveIndex = 0; waveIndex < 4; waveIndex++) {
        ctx.beginPath();
        for (let x = 0; x < canvas.width; x += 5) {
          const y = canvas.height * 0.25 * (waveIndex + 1) + 
                   Math.sin((x * 0.01) + time * 0.02 + waveIndex * Math.PI * 0.5) * 15;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }

    function animate() {
      time++;
      drawOceanWaves();
      
      particles.forEach(particle => {
        particle.update(time);
        particle.draw();
      });

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    init();
    animate();
  </script>
</body>
</html>
