<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coastal Glow Wallpaper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: #040d16; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let t = 0;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, '#061c2a');
      gradient.addColorStop(0.48, '#0c2a35');
      gradient.addColorStop(1, '#040d16');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawGlow(x, y, r, color) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, color);
      g.addColorStop(0.25, color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawOrb() {
      const x = canvas.width * 0.52;
      const y = canvas.height * 0.48;
      ctx.save();
      ctx.filter = 'blur(22px)';
      drawGlow(x, y, canvas.width * 0.34, 'rgba(127, 228, 255, 0.8)');
      drawGlow(x + 80, y + 30, canvas.width * 0.2, 'rgba(154, 213, 255, 0.35)');
      ctx.restore();

      ctx.strokeStyle = 'rgba(198, 236, 255, 0.28)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(x, y, canvas.width * 0.26, canvas.height * 0.33, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(3, 12, 18, 0.95)';
      ctx.beginPath();
      ctx.ellipse(x, y, canvas.width * 0.17, canvas.height * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawWaves() {
      for (let i = 0; i < 8; i++) {
        const phase = i * 1.5;
        const y = canvas.height * (0.18 + i * 0.1);
        ctx.strokeStyle = `rgba(145, 215, 255, ${0.1 + i * 0.04})`;
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        for (let x = -10; x < canvas.width + 10; x += 7) {
          const wave = Math.sin((x * 0.016) + t + phase) * (18 + i * 5);
          if (x === -10) ctx.moveTo(x, y + wave);
          else ctx.lineTo(x, y + wave);
        }
        ctx.stroke();
      }
    }

    function drawStars() {
      for (let i = 0; i < 52; i++) {
        const x = (i * 149) % canvas.width;
        const y = ((i * 67) % canvas.height) * 0.82;
        const alpha = 0.12 + (i % 6) * 0.08;
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fillRect(x, y, 2, 2);
      }
    }

    function animate() {
      t += 0.012;
      drawBackground();
      drawStars();
      drawWaves();
      drawOrb();
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
