<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bloom Wallpaper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: #020b08; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let t = 0;

    function drawBackground() {
      const g = ctx.createRadialGradient(
        canvas.width * 0.5,
        canvas.height * 0.52,
        80,
        canvas.width * 0.5,
        canvas.height * 0.52,
        canvas.width * 0.72
      );
      g.addColorStop(0, '#1d4b39');
      g.addColorStop(0.3, '#0f2b25');
      g.addColorStop(0.7, '#061712');
      g.addColorStop(1, '#020b08');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawGlow(x, y, r, color, alpha = 0.7) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, color);
      g.addColorStop(0.3, color.replace(')', `, ${alpha})`).replace('rgb', 'rgba'));
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBloom() {
      ctx.save();
      ctx.filter = 'blur(30px)';
      drawGlow(canvas.width * 0.52, canvas.height * 0.5, canvas.width * 0.3, 'rgba(93,255,170,0.9)');
      drawGlow(canvas.width * 0.62, canvas.height * 0.58, canvas.width * 0.2, 'rgba(118,255,204,0.6)');
      ctx.restore();

      ctx.strokeStyle = 'rgba(176, 245, 209, 0.28)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(canvas.width * 0.52, canvas.height * 0.5, canvas.width * 0.24, canvas.height * 0.3, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(canvas.width * 0.52, canvas.height * 0.5, canvas.width * 0.2, canvas.height * 0.25, Math.PI / 6, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(3, 10, 8, 0.9)';
      ctx.beginPath();
      ctx.ellipse(canvas.width * 0.52, canvas.height * 0.5, canvas.width * 0.17, canvas.height * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawMist() {
      for (let i = 0; i < 7; i++) {
        const x = (canvas.width * (i + 1)) / 8 + Math.sin(t * 0.4 + i) * 40;
        const y = canvas.height * (0.2 + (i % 3) * 0.16) + Math.cos(t * 0.5 + i) * 30;
        const w = canvas.width * 0.22 + i * 18;
        const h = canvas.height * 0.18 + i * 12;

        ctx.fillStyle = i % 2 === 0 ? 'rgba(160, 236, 194, 0.18)' : 'rgba(90, 180, 150, 0.12)';
        ctx.beginPath();
        ctx.ellipse(x, y, w, h, Math.PI * 0.22, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function animate() {
      t += 0.01;
      drawBackground();
      drawMist();
      drawBloom();
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
