<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Drift Wallpaper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: #020d18; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let t = 0;

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, '#061d30');
      gradient.addColorStop(0.48, '#0d2740');
      gradient.addColorStop(1, '#041316');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawGlow(x, y, r, color) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, color);
      g.addColorStop(0.32, color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawOrb() {
      const x = canvas.width * 0.52;
      const y = canvas.height * 0.48;

      ctx.save();
      ctx.filter = 'blur(26px)';
      drawGlow(x, y, canvas.width * 0.3, 'rgba(95, 198, 255, 0.9)');
      drawGlow(x - 80, y + 40, canvas.width * 0.22, 'rgba(142, 221, 255, 0.4)');
      ctx.restore();

      ctx.strokeStyle = 'rgba(191, 232, 255, 0.34)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(x, y, canvas.width * 0.28, canvas.height * 0.35, Math.PI * 0.06, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(x, y, canvas.width * 0.14, canvas.height * 0.2, Math.PI * 0.12, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(7, 26, 35, 0.95)';
      ctx.beginPath();
      ctx.ellipse(x, y, canvas.width * 0.13, canvas.height * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBands() {
      for (let i = 0; i < 10; i++) {
        const y = canvas.height * (0.18 + i * 0.09) + Math.sin(t * 0.4 + i) * 18;
        const alpha = 0.1 + i * 0.02;
        ctx.strokeStyle = `rgba(164, 214, 255, ${alpha})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let x = -40; x <= canvas.width + 40; x += 14) {
          const wave = Math.sin((x * 0.02) + t * 0.8 + i) * 26;
          if (x === -40) ctx.moveTo(x, y + wave);
          else ctx.lineTo(x, y + wave);
        }
        ctx.stroke();
      }
    }

    function drawStars() {
      for (let i = 0; i < 50; i++) {
        const x = (i * 131) % canvas.width;
        const y = ((i * 73) % canvas.height) * 0.85;
        ctx.fillStyle = `rgba(255,255,255,${0.14 + (i % 5) * 0.08})`;
        ctx.fillRect(x, y, 2, 2);
      }
    }

    function animate() {
      t += 0.01;
      drawBackground();
      drawStars();
      drawBands();
      drawOrb();
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
