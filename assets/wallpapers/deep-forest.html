<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Night Orbit Wallpaper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: #040b11; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let t = 0;

    function drawBackground() {
      const gradient = ctx.createRadialGradient(
        canvas.width * 0.48,
        canvas.height * 0.42,
        40,
        canvas.width * 0.48,
        canvas.height * 0.42,
        canvas.width * 0.8
      );
      gradient.addColorStop(0, '#112a38');
      gradient.addColorStop(0.4, '#0a1d27');
      gradient.addColorStop(0.75, '#070f15');
      gradient.addColorStop(1, '#030a0f');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawOrb() {
      const x = canvas.width * 0.52;
      const y = canvas.height * 0.48;

      ctx.save();
      ctx.filter = 'blur(12px)';
      const glow = ctx.createRadialGradient(x, y, 20, x, y, canvas.width * 0.35);
      glow.addColorStop(0, 'rgba(148, 226, 255, 0.75)');
      glow.addColorStop(0.2, 'rgba(135, 172, 255, 0.36)');
      glow.addColorStop(1, 'rgba(10, 18, 26, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y, canvas.width * 0.36, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.strokeStyle = 'rgba(200, 234, 255, 0.28)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(x, y, canvas.width * 0.26, canvas.height * 0.3, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(x, y, canvas.width * 0.18, canvas.height * 0.24, Math.PI * 0.2, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(2, 8, 13, 0.95)';
      ctx.beginPath();
      ctx.ellipse(x, y, canvas.width * 0.16, canvas.height * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawMist() {
      for (let i = 0; i < 9; i++) {
        const x = (canvas.width * (i + 0.5)) / 9 + Math.sin(t * 0.4 + i) * 46;
        const y = canvas.height * (0.28 + (i % 3) * 0.17) + Math.cos(t * 0.45 + i * 2) * 32;
        const w = canvas.width * (0.18 + i * 0.02);
        const h = canvas.height * 0.14 + i * 10;
        ctx.fillStyle = i % 2 === 0 ? 'rgba(188, 220, 255, 0.12)' : 'rgba(130, 157, 255, 0.08)';
        ctx.beginPath();
        ctx.ellipse(x, y, w, h, Math.PI * 0.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawStars() {
      for (let i = 0; i < 60; i++) {
        const x = ((i * 97) % canvas.width);
        const y = ((i * 53) % canvas.height) * 0.82;
        const alpha = 0.15 + ((i % 7) / 10);
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fillRect(x, y, 2, 2);
      }
    }

    function animate() {
      t += 0.009;
      drawBackground();
      drawStars();
      drawMist();
      drawOrb();
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
