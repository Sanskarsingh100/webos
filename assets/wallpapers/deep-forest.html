<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Forest Wallpaper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    const particleCount = 40;
    let time = 0;

    class Firefly {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = (Math.random() - 0.5) * 0.3;
        this.targetX = this.x;
        this.targetY = this.y;
        this.brightness = Math.random() * 0.5 + 0.3;
        this.pulsing = Math.random() * Math.PI * 2;
      }

      update(time) {
        // Wander
        if (Math.random() < 0.02) {
          this.targetX = Math.random() * canvas.width;
          this.targetY = Math.random() * canvas.height;
        }

        const dx = this.targetX - this.x;
        const dy = this.targetY - this.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance > 1) {
          this.x += (dx / distance) * 0.5;
          this.y += (dy / distance) * 0.5;
        }

        this.pulsing = time * 0.01;
      }

      draw() {
        const pulse = Math.sin(this.pulsing) * 0.3 + 0.7;
        ctx.save();
        ctx.globalAlpha = pulse * 0.8;
        
        // Glow
        const glowGradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 30);
        glowGradient.addColorStop(0, '#5dffaa');
        glowGradient.addColorStop(1, 'rgba(93, 255, 170, 0)');
        ctx.fillStyle = glowGradient;
        ctx.fillRect(this.x - 30, this.y - 30, 60, 60);
        
        // Core
        ctx.fillStyle = '#5dffaa';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
      }
    }

    function init() {
      particles.length = 0;
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Firefly());
      }
    }

    function drawGradient() {
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, '#0d3a2a');
      gradient.addColorStop(1, '#051410');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function animate() {
      time++;
      drawGradient();
      
      particles.forEach(particle => {
        particle.update(time);
        particle.draw();
      });

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    init();
    animate();
  </script>
</body>
</html>
