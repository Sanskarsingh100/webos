<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaf OS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="boot-overlay" id="bootOverlay">
    <div class="boot-content">
      <h1 class="boot-title">Leaf OS</h1>
      <div class="boot-spinner"></div>
      <p class="boot-text" id="bootText">Initializing system...</p>
    </div>
  </div>

  <div class="desktop" id="desktop">
    <div class="wallpaper" id="wallpaper"></div>
    
    <header class="topbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Search apps..." />
      </div>
      <div class="topbar-right">
        <button class="topbar-icon" id="wallpaperBtn" title="Change Wallpaper">🎨</button>
        <span class="time" id="topTime">--:--</span>
      </div>
    </header>

    <main class="windows-container" id="windowsContainer"></main>

    <footer class="dock">
      <div class="dock-content">
        <button class="dock-icon" data-app="welcome" title="Welcome">✦</button>
        <button class="dock-icon" data-app="clock" title="Clock">⏰</button>
        <button class="dock-icon" data-app="calendar" title="Calendar">📅</button>
        <button class="dock-icon" data-app="notes" title="Notes">📝</button>
        <div class="dock-separator"></div>
        <button class="dock-icon" data-app="settings" title="Settings">⚙️</button>
      </div>
    </footer>
  </div>

  <div id="wallpaperModal" class="modal hidden">
    <div class="modal-content">
      <h2>Select Wallpaper</h2>
      <div class="wallpaper-grid" id="wallpaperGrid"></div>
      <button class="modal-close" id="modalClose">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
